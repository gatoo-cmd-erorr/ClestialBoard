name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests & build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: |
            gradle-build.log
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClestialKeyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
